splash4|RADIX|-p{cores} -n1048576 -r1024|1|14400
splash4|OCEAN-CONT|-p{cores} -n130|1|14400
splash4|OCEAN-NOCONT|-p{cores} -n130|1|14400
splash4|BARNES|< {repo}/benchmarks/splash4/inputs/barnes-2048.in|1|14400
